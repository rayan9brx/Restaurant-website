spring.application.name=Restaurant

# Connect to local PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Update tables automatically during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Keep the login session cookie inaccessible to JavaScript.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Keep this directory on a persistent disk, outside the application and web root.
restaurant.upload-dir=${RESTAURANT_UPLOAD_DIR:${user.home}/.rayen-restaurant/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
