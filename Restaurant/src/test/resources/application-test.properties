# Tests use an isolated in-memory database, never the restaurant PostgreSQL database.
spring.datasource.url=jdbc:h2:mem:restaurant-auth-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
restaurant.owner.setup=false
